 # Shared local Postgres + pgvector. Other projects can connect to the same
# server on localhost:5432 and use their own database.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgvector-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgvector_playground
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
